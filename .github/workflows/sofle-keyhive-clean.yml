name: Sofle Keyhive Elite-C Firmware
on:
  push:
    branches: [sofle-keyhive-clean]
    paths:
      - 'keyboards/sofle/**'
      - '.github/workflows/sofle-keyhive-clean.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile Sofle Keyhive Vial
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          qmk compile -kb sofle/keyhive -km vial
      - name: Verify Elite-C flash usage
        shell: bash
        run: |
          bytes=$(avr-size --format=berkeley .build/sofle_keyhive_vial.elf | awk 'NR==2 {print $1+$2}')
          limit=28672
          echo "Flash used: $bytes / $limit bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le "$limit"
      - uses: actions/upload-artifact@v4
        with:
          name: sofle-keyhive-clean-vial-elite-c
          path: .build/sofle_keyhive_vial.hex
          if-no-files-found: error
          retention-days: 30
